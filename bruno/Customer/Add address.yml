info:
  name: Add address
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/v1/addresses"
  body:
    type: json
    data: |-
      {
        "address": "Flat 5, 1st Cross, Koramangala"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Saves a delivery address and returns its id.
