info:
  name: Order status
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/v1/orders/{{orderId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: For a second or two after Pay, the order is "paying". Then the fake payment provider calls our webhook, and it's "paid".
