info:
  name: Menu
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/v1/restaurants/{{restaurantId}}/menu"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: The restaurant with its dishes inside it. Prices are in paise, so 25000 is ₹250.
