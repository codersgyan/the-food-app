info:
  name: Pay
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/v1/orders/{{orderId}}/pay"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: 'Starts the payment. The answer comes back at once, with the order in "paying". Send it again, as if the customer tapped Pay twice: you get a 409, and nobody is charged twice.'
