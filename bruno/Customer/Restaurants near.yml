info:
  name: Restaurants near
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/v1/restaurants?near={{near}}"
  params:
    - name: near
      value: "{{near}}"
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: The restaurants within 7 km of the phone's spot on the map, nearest first.
