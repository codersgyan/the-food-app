info:
  name: Accept order
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/v1/orders/{{orderId}}/accept"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: The kitchen will cook this order. It works only on a paid order.
