# The same reverse proxy on your laptop, without HTTPS: nginx listens on
# port 8000 and passes requests to the API server you started with make run.
# host.docker.internal is your laptop, as seen from inside the container.
server {
    listen 8000;

    gzip on;
    gzip_types application/json;

    location /v1/ {
        proxy_pass http://host.docker.internal:8080;
    }

    location /payments/ {
        proxy_pass http://host.docker.internal:8080;
    }
}
