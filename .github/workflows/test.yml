name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Postgres 18 with PostGIS. CI runs on x86, where the official PostGIS
        # image works; the servers are ARM, so compose builds docker/postgres.
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: food
          POSTGRES_PASSWORD: food
          POSTGRES_DB: food_test
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U food -d food_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
