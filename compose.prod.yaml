# The app on a server: our API server and Postgres, in Docker. nginx runs on
# the server itself, in front of the API (see deploy/README.md).
#
# Run it with the settings file:
#
#     docker compose -f compose.prod.yaml --env-file /etc/food-api.env up -d --build

name: the-food-app-prod

services:
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://food:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}@postgres:5432/food?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the env file}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?set PAYMENT_WEBHOOK_SECRET in the env file}
      # Optional. Left empty, the server uses its default.
      NEAR_RADIUS_KM: ${NEAR_RADIUS_KM:-}
      FAKEOTP_DELAY: ${FAKEOTP_DELAY:-}
      FAKEPAY_DELAY: ${FAKEPAY_DELAY:-}
      FAKEPAY_FAIL_RATE: ${FAKEPAY_FAIL_RATE:-}
      FAKEPAY_DUPLICATE_RATE: ${FAKEPAY_DUPLICATE_RATE:-}
    ports:
      # Only on 127.0.0.1, so nginx on this machine can reach it, and the
      # internet can't. Every request has to go through nginx.
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: food
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: food
    # No ports: only the API container can reach the database.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food -d food"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
