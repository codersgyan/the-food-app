services:
  postgres:
    # Postgres 18 with PostGIS, for the spatial index on restaurants.
    build: ./docker/postgres
    environment:
      POSTGRES_USER: food
      POSTGRES_PASSWORD: food
      POSTGRES_DB: food
    ports:
      # 5440 on your machine, so it doesn't clash with a Postgres you already run on 5432.
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food -d food"]
      interval: 2s
      timeout: 2s
      retries: 15

  # The reverse proxy, on localhost:8000. The API server runs outside Docker
  # (make run), so nginx reaches it through host.docker.internal.
  nginx:
    image: nginx:1.28
    ports:
      - "8000:8000"
    volumes:
      - ./deploy/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["proxy"]

volumes:
  pgdata:
