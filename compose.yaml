services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: food
      POSTGRES_PASSWORD: food
      POSTGRES_DB: food
    ports:
      # 5440 on your machine, so it doesn't clash with a Postgres you already run on 5432.
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food -d food"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
